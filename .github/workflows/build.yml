name: Android APK
on:
  push:
    paths-ignore:
      - 'native3d/**'
      - '.github/workflows/native-3d.yml'
      - '.github/workflows/native-emulator.yml'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test bundled game assets
        run: |
          npm ci
          npm test
          npm run build
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - name: Build test APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk scarlet-veil-android-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scarlet-veil-android-test
          path: scarlet-veil-android-test.apk
          if-no-files-found: error
      - name: Publish Android prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/175fcd9f-waifu' && contains(github.event.head_commit.message, '[android-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-android scarlet-veil-android-test.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title 'Scarlet Veil v0.2.0 — Android Test' \
            --notes 'Android test APK for the improved 2D Scarlet Veil combat slice with loading, briefing, settings and local records. This is an offline WebView wrapper around the prototype, not a native 3D game. It is debug-signed for testing, not for Play Store distribution; Android 6.0 or newer is required. The build has not been tested on a physical device. See the repository README for installation and limitations.'
