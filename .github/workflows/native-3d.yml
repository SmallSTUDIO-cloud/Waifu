name: Native 3D validation
on:
  push:
    paths:
      - 'native3d/**'
      - '.github/workflows/native-3d.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.4.1-linux-x64
      - name: Install Godot
        run: |
          if [ ! -x "$HOME/.local/bin/godot" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
            unzip -p /tmp/godot.zip Godot_v4.4.1-stable_linux.x86_64 > "$HOME/.local/bin/godot"
            chmod +x "$HOME/.local/bin/godot"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import and smoke test
        run: |
          set -o pipefail
          timeout 300 godot --headless --path native3d --editor --import --quit 2>&1 | tee /tmp/import.log
          timeout 180 godot --headless --path native3d --script res://tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          timeout 180 godot --headless --path native3d --script res://tests/motion_pilot.gd 2>&1 | tee /tmp/motion-pilot.log
          timeout 180 godot --headless --path native3d --script res://tests/secondary_vfx.gd 2>&1 | tee /tmp/secondary-vfx.log
          timeout 180 godot --headless --path native3d --script res://tests/secondary_physics.gd 2>&1 | tee /tmp/secondary-physics.log
          timeout 180 godot --headless --path native3d --script res://tests/quality_settings.gd 2>&1 | tee /tmp/quality-settings.log
          timeout 180 godot --headless --path native3d --script res://tests/touch_camera.gd 2>&1 | tee /tmp/touch-camera.log
          timeout 180 godot --headless --path native3d --script res://tests/wiggle_physics.gd 2>&1 | tee /tmp/wiggle.log
          timeout 180 godot --headless --path native3d --script res://tests/enemy_combat.gd 2>&1 | tee /tmp/enemy-combat.log
          errors=$(grep -Eh 'SCRIPT ERROR|^ERROR:' /tmp/import.log /tmp/smoke.log /tmp/motion-pilot.log /tmp/secondary-vfx.log /tmp/secondary-physics.log /tmp/quality-settings.log /tmp/touch-camera.log /tmp/wiggle.log /tmp/enemy-combat.log | grep -v 'Parameter "t" is null' || true)
          if [ -n "$errors" ]; then
            echo "::error::$errors"
            exit 1
          fi
      - name: Capture software-rendered frame
        run: |
          mkdir -p /tmp/frames
          xvfb-run -a godot --path native3d --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --write-movie /tmp/frames/frame.png --fixed-fps 30 --quit-after 15 -- --smoke-play 2>&1 | tee /tmp/render.log
          shot=$(find /tmp/frames -name '*.png' | sort | tail -1)
          test -n "$shot"
          echo "SCREENSHOT=$shot" >> "$GITHUB_ENV"
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/render.log; then
            echo "::error::$(grep -E 'SCRIPT ERROR|^ERROR:' /tmp/render.log | head -8 | tr '\n' ' ')"
            exit 1
          fi
      - name: Software-rendered perf report
        run: |
          xvfb-run -a godot --path native3d --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --quit-after 240 -- --smoke-play --perf-report 2>&1 | tee /tmp/perf.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/perf.log; then
            echo "::error::perf run had script errors"
            exit 1
          fi
      - name: Store perf report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("/tmp/perf.log","rb").read()).decode(),"encoding":"base64"}))' > /tmp/perf-blob.json
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/perf-blob.json --jq .sha)
          echo "::warning title=Perf report::$sha"
      - name: Store screenshot for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,json,os; print(json.dumps({"content":base64.b64encode(open(os.environ["SCREENSHOT"],"rb").read()).decode(),"encoding":"base64"}))' > /tmp/blob.json
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/blob.json --jq .sha)
          echo "::warning title=Visual review screenshot::$sha"
      - name: Capture motion and combat frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet Pillow
          for action in authored-sprint authored-move baseline-review authored-review-front authored-review-side authored-review-rear authored-combo authored-dodge legacy-move legacy-dodge authored-settings; do
            mkdir -p "/tmp/preview-$action"
            frames=30
            if [[ "$action" = *combo ]]; then frames=66; fi
            if [[ "$action" = *review* ]]; then frames=90; fi
            preview_action="$action"
            extra=""
            if [[ "$action" = authored-* ]]; then preview_action="${action#authored-}"; extra="--preview-authored"; fi
            if [[ "$action" = baseline-review ]]; then preview_action="review-front"; extra="--legacy-walk --legacy-dash"; fi
            if [[ "$action" = legacy-move ]]; then preview_action="move"; extra="--legacy-walk"; fi
            if [[ "$action" = legacy-dodge ]]; then preview_action="dodge"; extra="--legacy-dash"; fi
            xvfb-run -a godot --path native3d --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --write-movie "/tmp/preview-$action/frame.png" --fixed-fps 30 --quit-after "$frames" -- "--preview-$preview_action" $extra > "/tmp/preview-$action.log" 2>&1
            if grep -E 'SCRIPT ERROR|^ERROR:' "/tmp/preview-$action.log"; then exit 1; fi
            frame_number=12
            if [[ "$action" = *dodge ]]; then frame_number=7; fi
            if [[ "$action" = *combo ]]; then frame_number=36; fi
            shot=$(find "/tmp/preview-$action" -name '*.png' | sort | sed -n "${frame_number}p")
            test -n "$shot"
            python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$shot" > /tmp/preview-blob.json
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/preview-blob.json --jq .sha)
            echo "::warning title=Preview $action::$sha"
            python3 - "$action" <<'PYCODE'
          import glob, sys
          from PIL import Image
          action = sys.argv[1]
          paths = sorted(glob.glob('/tmp/preview-' + action + '/*.png'))
          frames = []
          for path in paths[::2]:
              im = Image.open(path).convert('RGB')
              im.thumbnail((640, 360))
              frames.append(im.quantize(colors=128, method=Image.Quantize.FASTOCTREE))
          frames[0].save('/tmp/preview-' + action + '.gif', save_all=True, append_images=frames[1:], duration=67, loop=0, optimize=True)
          PYCODE
            python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "/tmp/preview-$action.gif" > /tmp/preview-gif.json
            gifsha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/preview-gif.json --jq .sha)
            echo "::warning title=Animation $action::$gifsha"
          done
      - name: Store diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat /tmp/import.log /tmp/smoke.log /tmp/motion-pilot.log /tmp/secondary-vfx.log /tmp/secondary-physics.log /tmp/quality-settings.log /tmp/touch-camera.log /tmp/wiggle.log /tmp/enemy-combat.log /tmp/render.log /tmp/perf.log 2>/dev/null > /tmp/diagnostics.txt || true
          python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("/tmp/diagnostics.txt","rb").read()).decode(),"encoding":"base64"}))' > /tmp/diagnostics.json
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/diagnostics.json --jq .sha)
          echo "::warning title=Diagnostics::$sha"
