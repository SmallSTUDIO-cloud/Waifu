name: Native Android emulator smoke
on:
  push:
    paths:
      - '.github/workflows/native-emulator.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache Godot and Android template
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-android-profile-v1
      - name: Install Godot and debug template
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          if [ ! -x "$HOME/.local/bin/godot" ]; then
            curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
            unzip -p /tmp/godot.zip Godot_v4.4.1-stable_linux.x86_64 > "$HOME/.local/bin/godot"
            chmod +x "$HOME/.local/bin/godot"
          fi
          target="$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          if [ ! -s "$target" ]; then
            curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
            unzip -p /tmp/templates.tpz templates/android_debug.apk > "$target"
            rm -f /tmp/templates.tpz
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure debug export
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Import and build private debug APK
        run: |
          set -o pipefail
          sed -i 's/profile_debug=false/profile_debug=true/' native3d/project.godot
          godot --headless --path native3d --editor --import --quit > /tmp/android-import.log 2>&1
          godot --headless --path native3d --export-debug Android "$RUNNER_TEMP/secondary-debug.apk" 2>&1 | tee /tmp/android-export.log
          test -s "$RUNNER_TEMP/secondary-debug.apk"
          sed -i 's/profile_shadow_enabled=true/profile_shadow_enabled=false/' native3d/project.godot
          godot --headless --path native3d --export-debug Android "$RUNNER_TEMP/secondary-no-shadow.apk" 2>&1 | tee /tmp/android-export-no-shadow.log
          test -s "$RUNNER_TEMP/secondary-no-shadow.apk"
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            trap 'adb logcat -d -v brief -s godot:* Godot:* ActivityTaskManager:I ActivityManager:I AndroidRuntime:E > /tmp/android-debug.log; adb exec-out screencap -p > /tmp/android-debug.png || true' EXIT
            set -e
            echo '::warning title=Emulator phase::Starting install'
            adb wait-for-device
            adb shell input keyevent 82
            echo '::warning title=Emulator phase::Installing APK'
            adb install -r "$RUNNER_TEMP/secondary-debug.apk"
            : > /tmp/android-live.log
            for level in 2 0 1; do echo "::warning title=Emulator tier::Testing physics quality $level"; adb shell am force-stop com.smallstudio.scarletveil3d; adb shell pm clear com.smallstudio.scarletveil3d > /dev/null; adb logcat -c; adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.smallstudio.scarletveil3d; if [ "$level" = 2 ]; then sleep 50; else sleep 20; fi; adb shell pidof com.smallstudio.scarletveil3d || exit 1; adb exec-out screencap -p > "/tmp/android-menu-$level.png"; if [ "$level" = 0 ] || [ "$level" = 1 ]; then adb shell input tap 240 190; sleep 1; fi; if [ "$level" = 1 ]; then adb shell input tap 240 190; sleep 1; fi; adb shell input tap 320 155; sleep 2; adb shell dumpsys gfxinfo com.smallstudio.scarletveil3d reset > /dev/null; adb shell input swipe 35 280 35 210 2500; adb shell input tap 590 280; adb shell input tap 530 280; sleep 9; adb shell dumpsys gfxinfo com.smallstudio.scarletveil3d framestats > /tmp/android-framestats.txt; adb shell pidof com.smallstudio.scarletveil3d || exit 1; adb exec-out screencap -p > /tmp/android-frame.png; adb logcat -d -v brief > "/tmp/android-tier-$level.log"; cat "/tmp/android-tier-$level.log" >> /tmp/android-live.log; grep "SECONDARY_PROFILE.*quality=$level " "/tmp/android-tier-$level.log" || { echo "::error::Missing profile or incorrect quality selection: $level"; exit 1; }; done
            adb shell am force-stop com.smallstudio.scarletveil3d && adb install -r "$RUNNER_TEMP/secondary-no-shadow.apk" && adb shell pm clear com.smallstudio.scarletveil3d > /dev/null && adb logcat -c && adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.smallstudio.scarletveil3d && sleep 20 && adb shell input tap 320 155 && sleep 2 && adb shell input swipe 35 280 35 210 2500 && adb shell input tap 590 280 && adb shell input tap 530 280 && sleep 9 && adb shell pidof com.smallstudio.scarletveil3d && adb logcat -d -v brief > /tmp/android-no-shadow.log && cat /tmp/android-no-shadow.log >> /tmp/android-live.log && grep "SECONDARY_PROFILE.*quality=2 shadow_captures=0 " /tmp/android-no-shadow.log
            adb shell dumpsys activity activities > /tmp/android-activity.txt
            adb logcat -d -s AndroidRuntime:E > /tmp/android-errors.log
            if grep -q 'FATAL EXCEPTION' /tmp/android-errors.log; then cat /tmp/android-errors.log; exit 1; fi
      - name: Summarize Android emulator frame data
        if: always()
        run: |
          if [ -f /tmp/android-framestats.txt ]; then
            cat /tmp/android-framestats.txt | head -45
          fi
      - name: Verify frame is not blank
        run: |
          python3 -m pip install --quiet Pillow
          python3 -c 'from PIL import Image; im=Image.open("/tmp/android-frame.png").convert("RGB"); print("size", im.size, "colors", len(im.getcolors(im.width*im.height) or [])); assert len(im.getcolors(im.width*im.height) or []) > 10, "Android frame is blank"'
      - name: Store emulator frame for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("/tmp/android-frame.png","rb").read()).decode(),"encoding":"base64"}))' > /tmp/android-frame.json
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/android-frame.json --jq .sha)
          echo "::warning title=Android screenshot::$sha"
      - name: Store emulator diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/android-debug.log ]; then
            { cat /tmp/android-activity.txt /tmp/android-framestats.txt 2>/dev/null; grep -i -E 'godot|smallstudio|SECONDARY_PROFILE|fatal|exception|error:' /tmp/android-live.log 2>/dev/null | tail -3000; } > /tmp/android-debug-tail.log || true
            python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("/tmp/android-debug-tail.log","rb").read()).decode(),"encoding":"base64"}))' > /tmp/android-debug.json
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/android-debug.json --jq .sha)
            echo "::warning title=Android diagnostics::$sha"
          fi
          if [ -s /tmp/android-debug.png ]; then
            python3 -c 'import base64,json; print(json.dumps({"content":base64.b64encode(open("/tmp/android-debug.png","rb").read()).decode(),"encoding":"base64"}))' > /tmp/android-debug-image.json
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/android-debug-image.json --jq .sha)
            echo "::warning title=Android failure screenshot::$sha"
          fi
